<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>David Picture Pro - Détecteur Congo</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f0f2f5;
  padding: 20px;
  max-width: 500px;
  margin: auto;
  color: #222;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

h2 {
  text-align: center;
  color: #075dcc;
}

input {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: 2px solid #0077ff;
  margin: 10px 0;
  font-size: 15px;
}

button, .video-link {
  display: block;
  width: 100%;
  padding: 14px;
  background: #0077ff;
  color: white;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  font-size: 16px;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
}

.result {
  margin-top: 20px;
  padding: 15px;
  border-radius: 10px;
  line-height: 1.6;
  display: none;
  overflow-wrap: anywhere;
}

.yellow {
  background: #fff3cd;
}

.green {
  background: #d4edda;
}

.orange {
  background: #ffe0b2;
}

.red {
  background: #f8d7da;
}

.contact {
  margin-top: 20px;
  font-size: 12px;
  text-align: center;
  color: gray;
  line-height: 1.8;
}

h3 {
  font-size: 17px;
}
</style>
</head>

<body>

<div class="card">

<h2>🛡️ Détecteur Congo<br>David Picture Pro</h2>

<p>
Colle le lien d'une vidéo TikTok que tu souhaites vérifier.
</p>

<form id="formulaire">
  <input
    id="link"
    type="url"
    placeholder="https://www.tiktok.com/@.../video/..."
    aria-label="Lien de la vidéo TikTok"
    required
  >

  <button type="submit">🔎 Examiner le lien</button>
</form>

<div id="res" class="result" role="status" aria-live="polite"></div>

<div class="contact">
  David Picture Pro<br>
  TikTok : @davidpicturepro5<br>
  Outil d'aide à la vérification des vidéos
</div>

</div>

<script>
const formulaire = document.getElementById("formulaire");
const champLien = document.getElementById("link");
const resultat = document.getElementById("res");

formulaire.addEventListener("submit", function(event) {
  event.preventDefault();
  analyser();
});

function analyser() {
  const texte = champLien.value.trim();

  resultat.style.display = "block";

  let url;

  try {
    url = new URL(texte);
  } catch {
    resultat.className = "result red";
    resultat.innerHTML =
      "<b>❌ Lien invalide</b><br>" +
      "Colle un lien complet de vidéo TikTok, puis réessaie.";
    return;
  }

  const domaine = url.hostname.toLowerCase();

  const domaineAutorise =
    domaine === "tiktok.com" ||
    domaine.endsWith(".tiktok.com");

  if (url.protocol !== "https:" || !domaineAutorise) {
    resultat.className = "result red";
    resultat.textContent =
      "❌ Ce lien ne semble pas être un lien TikTok sécurisé. " +
      "Vérifie son origine avant de continuer.";
    return;
  }

  resultat.className = "result yellow";

  resultat.innerHTML = `
    <b>🟡 RÉSULTAT : Authenticité non déterminée</b>

    <p>
      Le lien semble appartenir à TikTok, mais cela ne prouve
      pas que la vidéo est authentique.
    </p>

    <h3>🔍 Comment vérifier cette vidéo ?</h3>

    <ol>
      <li>Regarde si la vidéo possède une source originale fiable.</li>
      <li>Vérifie si d'autres sources indépendantes confirment les faits.</li>
      <li>Observe les éventuelles incohérences entre les lèvres,
      la voix, les mouvements et l'éclairage.</li>
      <li>Recherche une éventuelle mention de contenu généré par IA.</li>
    </ol>

    <p>
      <b>Important :</b> ces indices ne suffisent pas, à eux seuls,
      à prouver qu'une vidéo est fausse ou générée par IA.
    </p>

    <a
      class="video-link"
      href="${url.href}"
      target="_blank"
      rel="noopener noreferrer"
    >▶️ Ouvrir la vidéo TikTok</a>

    <p>
      <b>Conclusion :</b> une analyse technique supplémentaire
      est nécessaire pour évaluer cette vidéo.
    </p>
  `;
}
</script>

</body>
</html>
